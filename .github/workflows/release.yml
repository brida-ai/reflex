name: Release public Reflex registry

on:
  workflow_dispatch:
    inputs:
      impact:
        description: Semantic version impact for this public registry snapshot
        required: true
        type: choice
        options: [patch, minor, major]
      expected_sha:
        description: Exact main SHA approved for release
        required: true
        type: string

concurrency:
  group: reflex-public-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify exact SHA and release plan
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    outputs:
      source_sha: ${{ steps.plan.outputs.source_sha }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout trusted main without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Bind release to approved main SHA
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          if ! [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "expected_sha must be an exact lowercase Git commit SHA." >&2
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED_SHA" ]; then
            echo "main moved: expected $EXPECTED_SHA, found $ACTUAL" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Re-run complete public registry QA
        run: pnpm check

      - name: Compute release from immutable tag history
        id: plan
        shell: bash
        env:
          RELEASE_IMPACT: ${{ inputs.impact }}
        run: |
          set -euo pipefail
          node scripts/release/plan.mjs "$RELEASE_IMPACT" | tee /tmp/release-plan.json
          SOURCE_SHA="$(git rev-parse HEAD)"
          VERSION="$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync('/tmp/release-plan.json','utf8').trim());process.stdout.write(x.version)")"
          TAG="v$VERSION"
          test -z "$(git status --short)"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  release:
    name: Create immutable registry release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE_SHA: ${{ needs.verify.outputs.source_sha }}
      TAG: ${{ needs.verify.outputs.tag }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Create or verify immutable annotated tag without source checkout
        shell: bash
        run: |
          set -euo pipefail
          if ! [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid source SHA." >&2
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi

          COMMIT_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" --jq '.sha')"
          if [ "$COMMIT_SHA" != "$SOURCE_SHA" ]; then
            echo "Release source commit identity mismatch." >&2
            exit 1
          fi

          if REF_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" 2>/dev/null)"; then
            OBJECT_TYPE="$(printf '%s' "$REF_JSON" | jq -r '.object.type')"
            OBJECT_SHA="$(printf '%s' "$REF_JSON" | jq -r '.object.sha')"
            if [ "$OBJECT_TYPE" != "tag" ]; then
              echo "Existing $TAG is not an annotated tag." >&2
              exit 1
            fi
            TAG_JSON="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$OBJECT_SHA")"
            TAGGED_TYPE="$(printf '%s' "$TAG_JSON" | jq -r '.object.type')"
            TAGGED_SHA="$(printf '%s' "$TAG_JSON" | jq -r '.object.sha')"
            if [ "$TAGGED_TYPE" != "commit" ] || [ "$TAGGED_SHA" != "$SOURCE_SHA" ]; then
              echo "Refusing mismatched existing tag $TAG." >&2
              exit 1
            fi
          else
            TAG_OBJECT_SHA="$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/tags" \
              -f tag="$TAG" \
              -f message="$TAG" \
              -f object="$SOURCE_SHA" \
              -f type=commit \
              --jq '.sha')"
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$TAG_OBJECT_SHA" >/dev/null
          fi

      - name: Create or verify GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; leaving it immutable."
          else
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Brida Reflex Registry $VERSION"
          fi
