name: Release public Reflex registry

on:
  workflow_dispatch:
    inputs:
      impact:
        description: Semantic version impact for this public registry snapshot
        required: true
        type: choice
        options: [patch, minor, major]
      expected_sha:
        description: Exact main SHA approved for release
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: reflex-public-release
  cancel-in-progress: false

jobs:
  release:
    name: Verify exact SHA and create immutable release
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted main with full release history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Bind release to approved main SHA
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL="$(git rev-parse HEAD)"
          EXPECTED="${{ inputs.expected_sha }}"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "main moved: expected $EXPECTED, found $ACTUAL" >&2
            exit 1
          fi

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install from lockfile
        run: pnpm install --frozen-lockfile

      - name: Re-run complete public registry QA
        run: pnpm check

      - name: Compute release from immutable tag history
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/release/plan.mjs "${{ inputs.impact }}" | tee /tmp/release-plan.json
          VERSION="$(node -e "const fs=require('node:fs');const x=JSON.parse(fs.readFileSync('/tmp/release-plan.json','utf8').trim());process.stdout.write(x.version)")"
          TAG="v$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create immutable annotated tag
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.plan.outputs.tag }}"
          SHA="$(git rev-parse HEAD)"
          if git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            TAG_SHA="$(git rev-parse "$TAG^{commit}")"
            if [ "$TAG_SHA" != "$SHA" ]; then
              echo "Refusing to move existing tag $TAG from $TAG_SHA to $SHA" >&2
              exit 1
            fi
          else
            git config user.name "brida-release"
            git config user.email "release@brida.ai"
            git tag -a "$TAG" -m "$TAG"
            git push origin "refs/tags/$TAG"
          fi

      - name: Create or verify GitHub Release
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ steps.plan.outputs.tag }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "GitHub Release $TAG already exists; leaving it immutable."
          else
            gh release create "$TAG" --repo "${{ github.repository }}"               --verify-tag --generate-notes --title "Brida Reflex Registry ${{ steps.plan.outputs.version }}"
          fi
