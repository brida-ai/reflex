name: Public PR Policy

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: public-pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  paths:
    name: Contributor path authority
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base policy only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Read pull-request file metadata without checking out fork code
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('node:fs')
            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            })
            fs.writeFileSync('.pr-files.json', JSON.stringify(files.map(({ filename, status }) => ({ filename, status }))))

      - name: Enforce external contributor path authority
        shell: bash
        run: |
          args=(.pr-files.json)
          if [[ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            args+=(--external)
          fi
          node scripts/check-pr-files.mjs "${args[@]}"
