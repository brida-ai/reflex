name: Public Registry CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: public-registry-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - name: Checkout untrusted source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up pnpm for Node 22+
        if: matrix.node != 20
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.21.0
          run_install: false

      - name: Set up Node.js 22+
        if: matrix.node != 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Set up Node.js 20 compatibility job
        if: matrix.node == 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20

      - name: Install pnpm 10 for Node.js 20
        if: matrix.node == 20
        run: npm install --global pnpm@10.17.1

      - name: Install from lockfile
        env:
          COREPACK_ENABLE_PROJECT_SPEC: ${{ matrix.node == 20 && '0' || '1' }}
        run: pnpm install --frozen-lockfile

      - name: Validate registry and public surface
        run: pnpm check

      - name: Reject whitespace errors in the proposed change
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          else
            git show --check --oneline HEAD
          fi
